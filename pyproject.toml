[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghg-emissions-explorer"
version = "0.0.1"
description = "Exploratory data analysis and dashboard for visualization GHG emissions of major countries"
authors = [
  { name = "Chris Sall" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.13"

[tool.setuptools]
# No importable package: this project is notebooks + data only.
packages = []


[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
force-sort-within-sections = true
